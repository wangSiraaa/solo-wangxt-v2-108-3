# 生产/标准环境：真实 PostgreSQL（应用通过 DATABASE_URL 连接）
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roast
      POSTGRES_PASSWORD: roast
      POSTGRES_DB: roast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roast"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://roast:roast@db:5432/roast
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
